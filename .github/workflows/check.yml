name: check

# The repo's checks used to exist only as two scripts nobody remembered to
# run. Running them on every PR and every push to main is the point; push is
# limited to main so a PR branch is not checked twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 and node are preinstalled on ubuntu-latest, so there is
      # nothing to set up — every check is Python stdlib or Node built-ins.
      - name: Run ./scripts/check.sh
        run: ./scripts/check.sh
