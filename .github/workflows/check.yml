name: check

# The repo's checks used to exist only as two scripts nobody remembered to
# run. Running them on every push is the point.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3, node, jq and zip/unzip are preinstalled on ubuntu-latest, so
      # there is nothing to set up — everything here is stdlib or coreutils.
      - name: Run ./scripts/check.sh
        run: ./scripts/check.sh
