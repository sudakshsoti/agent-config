name: upstream-drift

# lint-skills.py compares external-skills.txt with what each bare `external`
# source really ships, but only where vendor/ is cloned, which check.yml never
# does. Kept off push so an upstream change cannot fail an unrelated commit.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone bare external sources
        run: python3 scripts/clone-bare-sources.py
      - name: Lint skills against the clones
        run: python3 scripts/lint-skills.py
