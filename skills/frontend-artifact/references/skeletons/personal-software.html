<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE: tool name</title>
<!-- Fonts: see ../fonts.md. One family carries the whole tool; mono only for identifiers. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap">
<style>
/* Starter tokens for personal-software. Change a value only with a stated reason. */
:root {
  color-scheme: light;
  --font-ui: "Geist", "Helvetica Neue", Arial, sans-serif;
  --font-code: "Geist Mono", ui-monospace, Menlo, monospace;
  --size-body: 0.9375rem;       /* 15px: a tool, not an essay */
  --size-small: 0.8125rem;
  --size-title: 1rem;           /* the title is orientation, not a headline */
  --leading-body: 1.5;
  --space: 0.5rem;
  --row: 2.75rem;               /* 44px minimum row height keeps targets reachable */
  --ground: oklch(100% 0 0);
  --ink: oklch(18% 0.01 260);
  --ink-soft: oklch(48% 0.01 260);
  --rule: oklch(90% 0.006 260);
  --accent: oklch(48% 0.17 265); /* links, selection, the one primary action */
  --accent-soft: oklch(95% 0.03 265);
  --radius: 6px;
}
* { box-sizing: border-box; }
html { font-kerning: normal; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: var(--size-body)/var(--leading-body) var(--font-ui); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 0.15em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .id { font-family: var(--font-code); font-size: 0.92em; }

.app { max-width: 44rem; margin: 0 auto; padding: calc(var(--space) * 3); }
.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: calc(var(--space) * 2); margin-bottom: calc(var(--space) * 2); }
h1 { font-size: var(--size-title); font-weight: 600; margin: 0; }
.count { font-size: var(--size-small); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Controls sit beside the list they act on. */
.controls { display: flex; flex-wrap: wrap; gap: var(--space); margin-bottom: calc(var(--space) * 2); }
input[type="search"], select { font: inherit; color: inherit; background: var(--ground); border: 1px solid var(--rule); border-radius: var(--radius); padding: calc(var(--space) * 0.75) var(--space); min-height: 2.25rem; }
input[type="search"] { flex: 1 1 14rem; }
button { font: inherit; font-weight: 500; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: var(--radius); padding: calc(var(--space) * 0.75) calc(var(--space) * 1.5); min-height: 2.25rem; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Rows, not cards. Hairline rules do the grouping. */
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 1fr auto; column-gap: calc(var(--space) * 2); align-items: baseline; min-height: var(--row); padding: calc(var(--space) * 1.25) 0; border-bottom: 1px solid var(--rule); }
.row .meta { font-size: var(--size-small); color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .tags { grid-column: 1 / -1; font-size: var(--size-small); color: var(--ink-soft); }
.row[aria-selected="true"] { background: var(--accent-soft); margin: 0 calc(var(--space) * -1); padding-inline: var(--space); }
.group { font-size: var(--size-small); color: var(--ink-soft); padding: calc(var(--space) * 2) 0 var(--space); }
.empty { padding: calc(var(--space) * 4) 0; color: var(--ink-soft); }
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <h1>REPLACE: tool name</h1>
    <span class="count" aria-live="polite">REPLACE: 24 items</span>
  </div>

  <form class="controls" role="search" onsubmit="return false">
    <label for="q" class="visually-hidden" hidden>Search</label>
    <input id="q" type="search" placeholder="Search titles and tags" aria-label="Search titles and tags">
    <select aria-label="Filter by tag"><option>All tags</option><option>REPLACE</option></select>
    <button type="button" class="primary">REPLACE: primary action</button>
  </form>

  <ul class="list">
    <li class="group" aria-hidden="true">REPLACE: group label, only if the content has real groups</li>
    <li class="row">
      <a href="#">REPLACE: item title, long enough to be a real title</a>
      <span class="meta">REPLACE: 12 Sep</span>
      <span class="tags">REPLACE: tag · tag</span>
    </li>
    <li class="row">
      <a href="#">REPLACE: second item</a>
      <span class="meta">REPLACE: 03 Sep</span>
    </li>
  </ul>
  <p class="empty" hidden>Nothing matches. Clear the search or pick another tag.</p>
</main>
</body>
</html>
