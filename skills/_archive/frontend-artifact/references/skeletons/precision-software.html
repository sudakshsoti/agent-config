<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE: workspace name</title>
<!-- Fonts: see ../fonts.md. A UI sans with distinct small forms and tabular figures, plus its mono. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Starter tokens for precision-software. Change a value only with a stated reason. */
:root {
  color-scheme: light;
  --font-ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --size-body: 0.875rem;        /* 14px compact register */
  --size-small: 0.75rem;
  --size-title: 0.9375rem;      /* orientation, kept close to body */
  --leading-body: 1.45;
  --space: 0.5rem;
  --row: 2.25rem;               /* 36px rows; state the register in the report */
  --ground: oklch(99% 0.002 260);
  --surface: oklch(97% 0.004 260);   /* a bounded working region, used once or twice */
  --ink: oklch(20% 0.012 260);
  --ink-soft: oklch(50% 0.012 260);
  --rule: oklch(89% 0.006 260);
  --accent: oklch(52% 0.15 262);
  --accent-soft: oklch(95% 0.025 262);
  --ok: oklch(58% 0.14 150); --warn: oklch(70% 0.15 75); --bad: oklch(56% 0.19 25);
  --radius: 4px;                /* one radius for controls and bounded regions */
}
* { box-sizing: border-box; }
html { font-kerning: normal; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: var(--size-body)/var(--leading-body) var(--font-ui); font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code, .id { font-family: var(--font-code); font-size: 0.92em; }
button, select, input { font: inherit; color: inherit; }

/* Toolbar: title, view tabs, one primary action. No hero. */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space) calc(var(--space) * 2); padding: var(--space) calc(var(--space) * 2); border-bottom: 1px solid var(--rule); }
h1 { font-size: var(--size-title); font-weight: 600; margin: 0 auto 0 0; }
.tabs { display: flex; gap: 2px; }
.tabs button { background: none; border: 1px solid transparent; border-radius: var(--radius); padding: calc(var(--space) * 0.5) var(--space); color: var(--ink-soft); min-height: 1.75rem; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--rule); }
.tabs .n { color: var(--ink-soft); margin-left: 0.35em; }
.btn { border: 1px solid var(--rule); background: var(--ground); border-radius: var(--radius); padding: calc(var(--space) * 0.5) calc(var(--space) * 1.5); min-height: 1.75rem; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Working region: aligned columns shared by every row. */
.grid { display: grid; grid-template-columns: 7rem minmax(12rem, 1fr) minmax(8rem, max-content) 4rem; column-gap: calc(var(--space) * 2); }
.grid > * { display: contents; }
.grid .cell { padding: 0 var(--space); min-height: var(--row); display: flex; align-items: center; border-bottom: 1px solid var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid .head .cell { font-size: var(--size-small); color: var(--ink-soft); font-weight: 500; min-height: 1.75rem; }
.grid .row[aria-selected="true"] .cell { background: var(--accent-soft); }
.grid .cell.id { color: var(--ink-soft); }
.grid .cell.num { justify-content: flex-end; }
.status { display: inline-flex; align-items: center; gap: 0.4em; }
.status::before { content: ""; width: 0.5em; height: 0.5em; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.bad { color: var(--bad); }
.grid .cell.sub { grid-column: 2; font-size: var(--size-small); color: var(--ink-soft); }
.region { margin: calc(var(--space) * 2); border: 1px solid var(--rule); border-radius: var(--radius); background: var(--ground); overflow-x: auto; }

@media (max-width: 640px) { .grid { grid-template-columns: 6rem minmax(10rem, 1fr) 6rem; } .grid .cell.num { display: none; } }
</style>
</head>
<body>
<header class="toolbar">
  <h1>REPLACE: workspace</h1>
  <div class="tabs" role="tablist" aria-label="Views">
    <button role="tab" aria-selected="true">REPLACE: Open <span class="n">14</span></button>
    <button role="tab" aria-selected="false">REPLACE: Done <span class="n">62</span></button>
  </div>
  <button class="btn primary" type="button">REPLACE: primary action</button>
</header>

<main class="region" aria-label="REPLACE: records">
  <div class="grid" role="table">
    <div class="head" role="row"><span class="cell" role="columnheader">ID</span><span class="cell" role="columnheader">Title</span><span class="cell" role="columnheader">Status</span><span class="cell num" role="columnheader">Age</span></div>
    <div class="row" role="row" aria-selected="true">
      <span class="cell id" role="cell">REPLACE-1042</span>
      <span class="cell" role="cell">REPLACE: a record title of realistic length</span>
      <span class="cell" role="cell"><span class="status ok">REPLACE: Ready</span></span>
      <span class="cell num" role="cell">3d</span>
    </div>
    <div class="row" role="row">
      <span class="cell id" role="cell">REPLACE-1041</span>
      <span class="cell" role="cell">REPLACE: second record</span>
      <span class="cell" role="cell"><span class="status warn">REPLACE: Blocked</span></span>
      <span class="cell num" role="cell">9d</span>
    </div>
  </div>
</main>
</body>
</html>
