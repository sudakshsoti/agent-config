# OpenAI subscription active.
# Usage: omp --config ~/dev/agent-config/omp/overlays/openai.yml   (alias: ompo)
#
# Roles only. Everything else (theme, statusline, task, approvals, autolearn)
# stays in the base config.yml and is deliberately NOT repeated here.
modelRoles:
  default: openai-codex/gpt-5.6-luna:xhigh
  plan: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-luna:max
  task: openai-codex/gpt-5.6-terra:high
  smol: openai-codex/gpt-5.4-mini:low
  tiny: openai-codex/gpt-5.4-mini:low
  vision: openai-codex/gpt-5.6-luna:medium
  # Referenced by task.agentModelOverrides in config.yml. Read these as
  # "heavy worker" / "light worker" — the names come from the bundled
  # ~/.omp/agent/agents/{luna,terra}-worker.md agents, not from the provider.
  luna_worker: openai-codex/gpt-5.6-luna:xhigh
  terra_worker: openai-codex/gpt-5.6-terra:medium

retry:
  modelFallback: true
  usageAwareFallback: true
  fallbackChains:
    default:
      - anthropic/claude-opus-5:high
    "openai-codex/*":
      - anthropic/claude-sonnet-5:high
