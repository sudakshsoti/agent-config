# OpenAI subscription active ($100/mo tier — Claude-Max-5x-equivalent
# headroom, not top-of-line unlimited).
# Usage: omp --config ~/dev/agent-config/omp/overlays/openai.yml   (alias: ompo)
#
# ompo swaps the judgment vendor from Claude to ChatGPT and nothing else:
# ChatGPT (openai-codex) directs the judgment roles below (default/plan/slow/
# designer/vision); opencode-go still executes the worker roles (task/smol/
# tiny/commit), same as the base config.yml. Those four worker roles are
# deliberately NOT redefined here — omitting them lets them fall through from
# base, the same mechanism this file already relies on for the entire
# non-role config (theme/statusline/task engine/memory/autolearn).
#
# The gpt-5.6 family, by list price per 1M tokens (`omp models --json`).
# All three share a 272K window, text+image input, and the `max` thinking level:
#
#   luna   $0.20 / $1.20    terra   $2 / $12    sol   $5 / $30
#
# Artificial Analysis places Luna and Sol on the Intelligence-vs-Cost Pareto
# frontier ahead of Terra. Terra is intentionally the everyday default here
# at medium, per the selected OpenAI subscription; planning uses Sol at medium
# because it scores 56 for $0.37 per Intelligence Index task, while high only
# adds one point (57) for $0.55 and max costs $1.23 for 61.
#
# Medium is therefore the boring Pareto-ish planning choice: it preserves most
# of Sol's quality without paying the steep high/max premium. `slow` remains
# max for genuinely stuck work.
modelRoles:
  default: openai-codex/gpt-5.6-terra:medium
  plan: openai-codex/gpt-5.6-sol:medium
  slow: openai-codex/gpt-5.6-sol:max
  designer: openai-codex/gpt-5.6-sol:high
  vision: openai-codex/gpt-5.6-sol:medium

retry:
  modelFallback: true
  usageAwareFallback: true
  fallbackChains:
    default:
      - anthropic/claude-opus-5:high
    "openai-codex/*":
      - anthropic/claude-sonnet-5:high
