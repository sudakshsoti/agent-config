# Opencode Go overlay (apply with omp-go-overlay / the ompgo wrapper).
# Every role stays inside opencode-go: Spark 1.3 at xhigh everywhere,
# except plan (GLM 5.3 Flash, high) and adversary (DeepSeek v4 Flash, high).
# NOTE: ~/.local/bin/omp-go-overlay (dotfiles-owned) currently rewrites only
# the four roles default/plan/slow/smol into config.yml. The remaining
# modelRoles, agentModelOverrides and fallbackChains below are the declared
# intent; they take effect once that script learns the extra sections.
modelRoles:
  smol: opencode-go/muse-spark-1.3-contributor:xhigh
  default: opencode-go/muse-spark-1.3-contributor:xhigh
  plan: opencode-go/glm-5.3-flash:high
  slow: opencode-go/muse-spark-1.3-contributor:xhigh
  designer: opencode-go/muse-spark-1.3-contributor:xhigh
  vision: opencode-go/muse-spark-1.3-contributor:xhigh
  task: opencode-go/muse-spark-1.3-contributor:xhigh
  adversary: opencode-go/deepseek-v4-flash:high
  tiny: opencode-go/muse-spark-1.3-contributor:xhigh
  commit: opencode-go/muse-spark-1.3-contributor:xhigh
  advisor: opencode-go/muse-spark-1.3-contributor:xhigh
task:
  agentModelOverrides:
    scout: opencode-go/muse-spark-1.3-contributor:xhigh
    librarian: opencode-go/muse-spark-1.3-contributor:xhigh
    sonic: opencode-go/muse-spark-1.3-contributor:xhigh
    reviewer: opencode-go/muse-spark-1.3-contributor:xhigh
    security-reviewer: opencode-go/muse-spark-1.3-contributor:xhigh
alternates:
  smol: ["opencode-go/muse-spark-1.3-contributor:xhigh"] # single model — no dominated alternate
  default: ["opencode-go/muse-spark-1.3-contributor:xhigh"] # region fallback only; see region_fallback
  plan: ["opencode-go/glm-5.3-flash:high"] # single model — no dominated alternate
  slow: ["opencode-go/muse-spark-1.3-contributor:xhigh"] # single model — no dominated alternate
region_fallback:
  smol: opencode-go/mimo-v2.5:low  # if Spark unavailable in region
  default: opencode-go/mimo-v2.5:medium
  plan: opencode-go/mimo-v2.5:high
retry:
  fallbackChains:
    opencode-go/*:
      - opencode-go/muse-spark-1.3-contributor:xhigh
      - opencode-go/glm-5.3-flash:high
      - opencode-go/deepseek-v4-flash:high
    default:
      - opencode-go/muse-spark-1.3-contributor:xhigh
      - opencode-go/glm-5.3-flash:high
      - opencode-go/deepseek-v4-flash:high
