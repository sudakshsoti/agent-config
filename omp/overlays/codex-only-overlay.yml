# Applied via `omp --config` by the ompcodex() shell function (~/.zshrc).
# Per-invocation only — nothing here touches ~/.omp/agent/config.yml.
# Every role and every subagent override below is an openai-codex selector,
# and the fallback chains that can fire for those roles stay inside
# openai-codex too, so a long-horizon `ompcodex` run never drifts onto
# Anthropic, OpenCode, or OpenRouter mid-task.
modelRoleStorage: session
enabledModels:
  - openai-codex/gpt-5.6-luna
  - openai-codex/gpt-5.6-terra
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.3-codex-spark
disabledProviders:
  - anthropic
  - opencode-zen
  - opencode-go
  - openrouter
  - ollama
  - ollama-local
modelRoles:
  default: openai-codex/gpt-5.6-terra:high
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:xhigh
  designer: openai-codex/gpt-5.6-terra:high
  vision: openai-codex/gpt-5.6-terra:medium
  task: openai-codex/gpt-5.6-luna:xhigh
  adversary: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low
  advisor: openai-codex/gpt-5.6-terra:high
  reviewer: openai-codex/gpt-5.6-sol:high
  security-reviewer: openai-codex/gpt-5.6-sol:high
task:
  agentModelOverrides:
    task: openai-codex/gpt-5.6-luna:xhigh
    adversary: openai-codex/gpt-5.6-sol:high
    scout: openai-codex/gpt-5.6-luna:low
    librarian: openai-codex/gpt-5.6-terra:high
    sonic: openai-codex/gpt-5.6-luna:low
    reviewer: openai-codex/gpt-5.6-sol:high
    security-reviewer: openai-codex/gpt-5.6-sol:high
    code-worker: openai-codex/gpt-5.6-luna:high
    builder: openai-codex/gpt-5.6-terra:high
    plan: openai-codex/gpt-5.6-sol:high
    critic: openai-codex/gpt-5.6-sol:high
    workflow: openai-codex/gpt-5.6-sol:medium
    research: openai-codex/gpt-5.6-terra:high
retry:
  fallbackChains:
    openai-codex/*:
      - openai-codex/gpt-5.3-codex-spark:high
      - openai-codex/gpt-5.6-terra:medium
    default:
      - openai-codex/gpt-5.3-codex-spark:high
