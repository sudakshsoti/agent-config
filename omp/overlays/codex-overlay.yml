# Apply with `omp-codex-overlay`. Luna handles cheap work, Terra implementation,
# and Sol planning/deep work. Fallbacks are configured by the overlay script.
modelRoles:
  smol: openai-codex/gpt-5.6-luna:low # cheapest pareto for quick inline
  default: openai-codex/gpt-5.6-terra:medium # implementation pareto — balanced cost/reasoning
  plan: openai-codex/gpt-5.6-sol:high # planning pareto — frontier quality at high, not xhigh
  slow: openai-codex/gpt-5.6-sol:xhigh # heavy pareto — deepest reasoning before max
  task: openai-codex/gpt-5.6-luna:xhigh # task pareto — cheap model, high effort
alternates:
  smol: ["openai-codex/gpt-5.6-luna:low"] # single pareto — no dominated alternate
  default: ["openai-codex/gpt-5.6-terra:high", "openai-codex/gpt-5.6-terra:low"] # high when you want more reasoning, low when you want cheap
  plan: ["openai-codex/gpt-5.6-sol:medium", "openai-codex/gpt-5.6-terra:high"] # medium if you cap cost, terra:high if Sol unavailable
  slow: ["openai-codex/gpt-5.6-sol:max", "openai-codex/gpt-5.6-sol:high"] # max is alternate deep reasoning, high is fallback within same model
  task: ["openai-codex/gpt-5.6-luna:max", "openai-codex/gpt-5.6-luna:high"] # max for extra effort, high if xhigh is too slow
