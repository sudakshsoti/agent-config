# Anthropic subscription active.
# Usage: omp --config ~/dev/agent-config/omp/overlays/anthropic.yml   (alias: ompc)
#
# Roles only. Everything else (theme, statusline, task, approvals, autolearn)
# stays in the base config.yml and is deliberately NOT repeated here.
#
# ompc pins the judgment/worker split explicitly: Claude directs the
# judgment roles below (default/plan/slow/designer/vision), and task/smol/
# tiny/commit are left undefined here so they fall through to opencode-go in
# the base config.yml. The default is Sonnet for routine work; planning uses
# Opus at the Artificial Analysis Pareto-ish medium effort.
#
# This overlay owns its judgment defaults so ompc remains stable if the base
# config's model roles change later.
modelRoles:
  default: anthropic/claude-sonnet-5:medium
  plan: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  designer: anthropic/claude-opus-5:high
  vision: anthropic/claude-sonnet-5:medium

retry:
  modelFallback: true
  usageAwareFallback: true
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-luna:xhigh
    "anthropic/*":
      - openai-codex/gpt-5.6-terra:high
