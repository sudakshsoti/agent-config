# Project model roles for ~/dev/OQGA. Symlinked to OQGA/.omp/config.yml by
# install.sh step 3j. Overrides the global roles in omp/config.yml; anything
# not listed here falls through to global.
#
# WHY THIS FILE EXISTS
# OQGA is Optum HEDIS chart-abstraction work — measure logic, clinical
# data entry and audit trails. Whether that content may be used to train a
# third-party model is a contract question, not a personal preference, so it
# gets decided here rather than left to the global config.
#
# `opencode-go/muse-spark-1.2-contributor` is the ONE model in the OpenCode Go
# lineup marked "Model training: Yes / Data retention: Not ZDR" on
# opencode.ai/docs/go. Meta says the same at dev.meta.ai/docs/pricing-rate-limits:
# the contributor tier is discounted in exchange for permission to train on
# prompts and completions. Globally that trade is fine. Here it is not.
#
# So every role and override that resolves to Muse Spark globally is pinned to
# something else below. Every other Go model is "Not used / 0 days" and stays
# available, which is why the Go fleet is still in the fallback chains.
#
# This repo is ~540 PNGs and ~15k lines of Markdown, so the roles that matter
# are the read-heavy ones: scout, librarian, and vision via the global role.
#
# THINKING LEVELS: glm-5.3-flash and deepseek-v4-flash both expose only
# low/high/max — no `medium`. Verified with `omp models --json`.

modelRoles:
  commit: anthropic/claude-haiku-4-5:low
  advisor: opencode-go/glm-5.3-flash:high

task:
  agentModelOverrides:
    # Read-heavy and image-heavy, and you WAIT on both of these. DeepSeek V4
    # Flash measured 12.0s per 400 words vs Sonnet's 13.5s, 1M context, image
    # input, ZDR. GLM sits at 1.1 tok/s over 3 samples in omp's model_perf and
    # has no SWE-bench Verified score from anyone, so it only keeps `advisor`,
    # which nobody waits on. See docs/2026-08-29-model-roles-post-codex.md.
    scout: opencode-go/deepseek-v4-flash:low
    librarian: opencode-go/deepseek-v4-flash:high
    sonic: opencode-go/qwen3.8-flash:low

retry:
  # Same INVARIANT as global: no `anthropic/*` entry in any chain. Muse Spark
  # is additionally excluded from every chain here, including `default` — a
  # retry must not become the leak the roles above prevent.
  #
  # fallbackChains DEEP-MERGES with global: any chain key this file omits
  # survives from omp/config.yml as-is. Verified with `omp config list` run
  # from this directory. That is why `adversary` is restated below — the
  # global one lists Muse Spark second, and inheriting it would reopen
  # exactly the hole the roles above close. Restate every chain key that
  # exists globally, even to say the same thing.
  fallbackChains:
    adversary:
      - opencode-go/glm-5.3-flash:high
    anthropic/*:
      - opencode-go/glm-5.3-flash:high
      - opencode-go/minimax-m3:medium
      - opencode-go/deepseek-v4-flash:low
    opencode-go/*:
      - opencode-go/glm-5.3-flash:high
      - opencode-go/minimax-m3:medium
      - opencode-go/deepseek-v4-flash:low
    default:
      - opencode-go/glm-5.3-flash
      - opencode-go/minimax-m3
      - opencode-go/deepseek-v4-flash
