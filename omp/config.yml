modelRoles: 
  default: anthropic/claude-opus-5:medium
  plan: anthropic/claude-opus-5:high
  slow: anthropic/claude-opus-5:xhigh
  designer: anthropic/claude-opus-5:high
  vision: anthropic/claude-sonnet-5:medium
  task: opencode-go/deepseek-v4-pro:high
  adversary: opencode/gemini-3.7-flash:high
  smol: opencode-go/gpt-5.6-luna:low
  tiny: opencode-go/gpt-5.6-luna:low
  commit: opencode-go/gpt-5.6-luna:low
task: 
  batch: true
  enableEffort: true
  eager: preferred
  enableLsp: true
retry: 
  enabled: true
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 15
  usageReservePolicy: confirm
  fallbackChains: 
    opencode-go/deepseek-v4-pro: 
      - opencode-zen/deepseek-v4-pro:high
      - opencode-zen/minimax-m3
    opencode-go/gpt-5.6-luna: 
      - opencode-zen/gpt-5.6-luna:low
      - opencode-zen/deepseek-v4-flash:low
    opencode-go/*: 
      - opencode-zen/gpt-5.6-luna
      - anthropic/claude-sonnet-5:high
    anthropic/*: 
      - opencode-go/gpt-5.6-luna:xhigh
      - opencode-zen/gpt-5.6-luna:xhigh
    default: 
      - opencode-go/gpt-5.6-luna:xhigh
      - opencode-zen/gpt-5.6-luna:xhigh
symbolPreset: nerd
theme: 
  dark: dark-lunar
setupVersion: 1
statusLine: 
  preset: default
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: false
  transparent: false
startup: 
  quiet: true
autoResume: false
modelRoleStorage: global
memory: 
  backend: local
autolearn: 
  enabled: true
  autoContinue: true
dev: 
  autoqaConsent: granted
hideThinkingBlock: false
advisor: 
  enabled: false
  syncBacklog: "off"
terminal: 
  showProgress: false
display: 
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: false
  collapseCompacted: true
defaultThinkingLevel: auto
providers: 
  autoThinkingModel: online
  autoThinkingMaxEffort: xhigh
  anthropic: 
    serverSideFallback: false
textVerbosity: medium
tier: 
  openai: none
  subagent: inherit
personality: friendly
steeringMode: one-at-a-time
compaction: 
  strategy: snapcompact
  handoffSaveToDisk: true
snapcompact: 
  systemPrompt: none