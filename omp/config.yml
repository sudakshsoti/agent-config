# INVARIANT: no `anthropic/` selector may appear anywhere in `fallbackChains`.
# Claude directs the judgment roles below, so an Anthropic rung in the retry
# ladder means a failed Claude call retries on Claude. Same lineage, no
# independent check, which is the whole point of the ladder. Every rung is a
# different vendor from the one above it.
modelRoles: 
  default: anthropic/claude-opus-5:medium
  plan: anthropic/claude-opus-5:high
  slow: anthropic/claude-opus-5:xhigh
  designer: anthropic/claude-opus-5:high
  vision: anthropic/claude-opus-5:medium
  task: openai-codex/gpt-5.6-luna:xhigh
  # Adversary was DeepSeek V4 Pro. Dropped: it is accurate but painfully slow,
  # and a plan review you wait on is a plan review you skip. Gemini 3.7 Flash is
  # a different lineage from every director model here, has a 1M window so it can
  # read the plan plus the files it cites, and returns in a fraction of the time.
  # On openrouter, not opencode-zen: same model, $0.375/$1.875 vs $1.50/$7.50.
  # That openrouter price is a promo that may expire 2026-12-31 — revisit then.
  adversary: openrouter/google/gemini-3.7-flash:high
  # prewalk.enabled is deliberately left off. On, omp switches from the active
  # model to this `smol` role at the first edit/write after the todo list
  # exists: Opus thinks and plans, luna:low types. That is worth having, but it
  # gets tried per-run with `omp --prewalk` on a multi-file change first, and
  # only becomes a default if the result holds up. Do not stack it with /vibe —
  # a director briefing a smol worker that then prewalks to smol is a no-op.
  smol: openai-codex/gpt-5.6-luna:low
  # Local, via the ollama-local provider in omp/models.yml. `tinyModel` and
  # `autoThinkingModel` stay `online` below — on that path omp prefers the
  # configured `tiny` role, so this routes session titles to the box without
  # touching those closed enums. Only `tiny` moves; every other role is
  # unchanged.
  # Qwen3.5 0.8B, not the 4B: this is a 16GB Mac and the 4B sat resident at
  # 4-6GB. The 0.8B loads at 1.1GB and returns a title in ~0.47s warm.
  # It only behaves because models.yml sends `reasoning_effort: none`. With
  # thinking on, the same title took 158 seconds and 5812 reasoning tokens.
  # If titles ever go slow again, check that first — not the model, not the
  # hardware.
  tiny: ollama-local/qwen3.5:0.8b
  commit: openai-codex/gpt-5.6-luna:low
task: 
  batch: true
  enableEffort: true
  eager: preferred
  enableLsp: true
retry: 
  enabled: true
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 15
  usageReservePolicy: confirm
  fallbackChains: 
    # Claude out of quota -> ChatGPT -> Google. Never back to Claude.
    anthropic/*: 
      - openai-codex/gpt-5.6-luna:xhigh
      - openrouter/google/gemini-3.7-flash:high
    # ChatGPT out of quota -> Google -> MiniMax. Never Claude.
    openai-codex/*: 
      - openrouter/google/gemini-3.7-flash:high
      - opencode-go/minimax-m3:high
    # Covers the adversary role. Ordered by remaining quota, not preference:
    # on 2026-08-15 `omp usage` had Codex at 21% of its 7-day limit and OpenCode
    # Go at 86% weekly, so Codex answers first and MiniMax is the last thing
    # tried. OpenCode Go is last in every chain it appears in for that reason.
    # Re-check with `omp usage` before reordering; the vendor-diversity
    # invariant at the top of this file outranks the capacity ordering.
    openrouter/*: 
      - openai-codex/gpt-5.6-luna:xhigh
      - opencode-go/minimax-m3:high
    opencode-go/*: 
      - openai-codex/gpt-5.6-luna:xhigh
    default: 
      - openrouter/google/gemini-3.7-flash:high
symbolPreset: nerd
theme: 
  dark: dark-lunar
setupVersion: 1
statusLine: 
  preset: default
  separator: powerline-thin
  sessionAccent: true
  compactThinkingLevel: false
  transparent: false
startup: 
  quiet: true
autoResume: false
modelRoleStorage: global
memory: 
  backend: local
autolearn: 
  enabled: true
  # autoContinue off. On, it ran a private capture turn at every stop and wrote
  # nine skills into ~/.omp/agent/managed-skills/ in three days. Six were
  # removed on 2026-08-15: one documented `ompc`/`ompo` overlays that no longer
  # exist, one hardcoded homelab ssh targets and uid 10000, one was truncated
  # mid-sentence, the rest were one-offs or duplicates. Those skills load into
  # every session at provider priority 5 and discovery is NOT gated by
  # `enabled`, so bad ones cost context until someone deletes them by hand.
  # `enabled` stays true: the standing guidance still lets the model capture a
  # lesson when it decides one is worth capturing. What is off is the unprompted
  # per-stop token spend that generated junk nobody asked for or read.
  autoContinue: false
dev: 
  # Denied. `dev.autoqa` defaults to true, which made omp POST every recorded
  # tool issue to https://qa.omp.sh/v1/grievances — the upstream author's
  # endpoint — on a background flush at insert, no manual push involved. Each
  # POST carried the stable install UUID from ~/.omp/install-id plus a
  # model-written free-text `report` field. All 12 rows in ~/.omp/autoqa.db were
  # already marked pushed before this was noticed, and they name internal
  # tooling and local paths. That data is gone; this only stops future sends.
  # DO NOT add `dev.autoqa: true` here. Setting it explicitly overrides this
  # denial and turns collection back on without any further prompt. Leaving the
  # key unset is what makes `denied` bind.
  autoqaConsent: denied
hideThinkingBlock: false
advisor: 
  enabled: false
  syncBacklog: "off"
terminal: 
  showProgress: false
display: 
  # On, because this config's whole premise is quota frugality and there was no
  # per-turn feedback at all. Items that trade quota for latency or cost are
  # unjudgeable without it.
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  collapseCompacted: true
defaultThinkingLevel: auto
providers: 
  # autoThinkingModel stays online. Moving it to a local tiny model would take
  # load off Codex, which is the emptiest account here at 21%, not the fullest,
  # and warm local inference at 0.36-1.6s is not obviously faster than one
  # luna:low call. Revisit once showTokenUsage has produced a real number for
  # what the `auto` thinking-level decisions actually cost.
  autoThinkingModel: online
  autoThinkingMaxEffort: xhigh
  anthropic:
    serverSideFallback: false
  webSearchOrder:
    - tavily
    - exa
textVerbosity: medium
tier: 
  openai: none
  subagent: inherit
personality: friendly
steeringMode: one-at-a-time
compaction: 
  strategy: snapcompact
  handoffSaveToDisk: true
snapcompact: 
  systemPrompt: none
# On means the model uses the native read/grep/glob/write tools instead of
# shelling out, so output arrives summarized and gitignore-aware rather than
# dumped raw into context, and long-lived processes start under `hub` where
# they can be observed instead of behind a bare `&`.
# CAVEAT, look here first if an edit lands wrong: three of the eleven built-in
# patterns reroute in-place edits — `sed -i`, `perl -i`, `awk -i inplace` — to
# the `edit` tool, which fuzzy-matches. That changes what those commands mean,
# so a script or a command written to edit exactly one thing can edit something
# else. The patterns are deliberately not overridden here: overriding means
# pasting all eleven rules into this file and re-diffing them against upstream
# on every `omp update`, which costs more to maintain than the risk is worth.
bashInterceptor: 
  enabled: true
# Every skill source is on, so omp discovers ~44 skills across ~/.agents/skills
# and ~/.claude/skills and puts each description in the system prompt every
# turn. Dedup is by realpath, so the symlinks are not the problem — these are
# Claude Code harness skills with no omp equivalent. Not the Codex duplication
# trap in AGENTS.md; this is a context-budget trim.
skills: 
  ignoredSkills: 
    - artifact-*
    - claude-in-chrome
    - claude-api
    - keybindings-help
    - update-config
    - statusline-setup
    - fewer-permission-prompts
    - loop
    - schedule
