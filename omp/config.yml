modelRoles: 
  default: anthropic/claude-sonnet-5:medium
  plan: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  designer: anthropic/claude-sonnet-5:medium
  vision: anthropic/claude-sonnet-5:medium
  task: openai-codex/gpt-5.6-luna:xhigh
  adversary: openai-codex/gpt-5.6-sol:low
  smol: openai-codex/gpt-5.6-luna:xhigh
  tiny: ollama-local/qwen3.5:0.8b
  commit: openai-codex/gpt-5.6-luna:low
task: 
  batch: true
  enableEffort: false
  eager: preferred
  enableLsp: true
retry: 
  enabled: true
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 15
  usageReservePolicy: auto
  fallbackChains: 
    anthropic/*: 
      - openai-codex/gpt-5.6-sol:low
      - opencode-go/minimax-m3:low
      - opencode-zen/deepseek-v4-flash:low
    openai-codex/*: 
      - opencode-go/minimax-m3:low
      - opencode-zen/deepseek-v4-flash:low
    opencode-go/*: 
      - opencode-zen/deepseek-v4-flash:low
    opencode-zen/*: 
      - opencode-go/minimax-m3:low
    default: 
      - opencode-zen/deepseek-v4-flash:low
symbolPreset: nerd
theme: 
  dark: quiet-lunar
setupVersion: 1
statusLine: 
  preset: default
  separator: powerline-thin
  sessionAccent: false
  compactThinkingLevel: false
  transparent: false
startup: 
  quiet: true
autoResume: false
modelRoleStorage: global
memory: 
  backend: local
autolearn: 
  enabled: true
  autoContinue: true
dev: 
  autoqaConsent: denied
hideThinkingBlock: false
advisor: 
  enabled: false
  syncBacklog: "off"
terminal: 
  showProgress: false
display: 
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  collapseCompacted: true
  cacheMissMarker: false
defaultThinkingLevel: auto
providers: 
  autoThinkingModel: online
  autoThinkingMaxEffort: xhigh
  webSearchOrder: 
    - tavily
    - exa
  memoryModel: online
textVerbosity: medium
tier: 
  openai: none
  subagent: inherit
personality: friendly
steeringMode: one-at-a-time
compaction: 
  strategy: snapcompact
  handoffSaveToDisk: true
snapcompact: 
  systemPrompt: none
bashInterceptor: 
  enabled: true
skills: 
  ignoredSkills: 
    - artifact-*
    - claude-in-chrome
    - claude-api
    - keybindings-help
    - update-config
    - statusline-setup
    - fewer-permission-prompts
    - loop
    - schedule
tools: 
  approvalMode: yolo
tui: 
  textSizing: false
  tight: false