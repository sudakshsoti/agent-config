modelRoles: 
  default: opencode-go/muse-spark-1.2-contributor:medium
  plan: opencode-go/muse-spark-1.2-contributor:high
  slow: opencode-go/qwen3.8-max:high
  designer: anthropic/claude-sonnet-5:medium
  vision: anthropic/claude-sonnet-5:medium
  task: openai-codex/gpt-5.6-luna:xhigh
  adversary: openai-codex/gpt-5.6-sol:low
  smol: opencode-go/muse-spark-1.2-contributor:low
  tiny: ollama-local/qwen3.5:0.8b
  commit: openai-codex/gpt-5.6-luna:low
task: 
  batch: true
  enableEffort: false
  eager: preferred
  enableLsp: true
retry: 
  enabled: true
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 15
  usageReservePolicy: auto
  fallbackChains: 
    anthropic/*: 
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
      - openai-codex/gpt-5.6-sol:low
    openai-codex/*: 
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
    opencode-go/*: 
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
      - opencode-zen/deepseek-v4-flash:low
    opencode-zen/*: 
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
    default: 
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
      - opencode-zen/deepseek-v4-flash:low
symbolPreset: nerd
theme: 
  dark: dark-lunar-statusline
  light: light
setupVersion: 2
statusLine: 
  preset: default
  separator: none
  sessionAccent: true
  compactThinkingLevel: false
  transparent: true
  leftSegments: 
    []
  rightSegments: 
    []
  contextLine: annotated
  showHookStatus: true
  segmentOptions: 
    {}
startup: 
  quiet: true
autoResume: false
modelRoleStorage: global
memory: 
  backend: local
autolearn: 
  enabled: true
  autoContinue: true
dev: 
  autoqaConsent: denied
hideThinkingBlock: true
advisor: 
  enabled: false
  syncBacklog: "off"
terminal: 
  showProgress: false
  showImages: true
display: 
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: false
  collapseCompacted: true
  cacheMissMarker: false
  hideToolActivity: false
defaultThinkingLevel: auto
providers: 
  autoThinkingModel: online
  autoThinkingMaxEffort: xhigh
  webSearchOrder: 
    - tavily
    - exa
  memoryModel: online
textVerbosity: medium
tier: 
  openai: none
  subagent: inherit
personality: friendly
steeringMode: one-at-a-time
compaction: 
  handoffSaveToDisk: true
  methodOrder: 
    - snapcompact
    - remote
    - soft
snapcompact: 
  systemPrompt: none
bashInterceptor: 
  enabled: true
skills: 
  ignoredSkills: 
    - artifact-*
    - claude-in-chrome
    - claude-api
    - keybindings-help
    - update-config
    - statusline-setup
    - fewer-permission-prompts
    - loop
    - schedule
tools: 
  approvalMode: yolo
tui: 
  textSizing: false
  tight: false
  renderMermaid: true
  codexResetFireworks: false
  titleState: true
  hyperlinks: auto
  scrollbackRebuild: false
  imeSafeCursor: false
  maxInlineImageColumns: 100
  maxInlineImageRows: 20
  maxInlineImages: 8
composer: 
  shape: claude
github: 
  enabled: true
vault: 
  enabled: true
spelling: 
  autocomplete: false
  typoDetection: false