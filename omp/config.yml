# OMP main config — Claude directs, OpenCode Go executes.
#
# Plain `omp` runs this. The overlays in omp/overlays/ pin every role to a
# single vendor instead; see the ompc/ompo/ompx aliases in ~/.zshrc.
#
#   Claude subscription  -> judgment, planning, hard reasoning  (flat cost)
#   opencode-go          -> high-volume worker execution        (metered $)
#
# Worker prices are $/1M in-out, from `omp models opencode-go --json`:
#   gpt-5.6-luna 0.10/0.60 · deepseek-v4-pro 0.435/0.87
#   deepseek-v4-flash 0.14/0.28 · kimi-k2.7-code 0.95/4 · glm-5.2 1.4/4.4
#
# luna is the cheapest thing in the catalog on input and carries a 1.1M window
# with vision, so it takes the mechanical tier outright — deepseek-v4-flash is
# 40% more expensive on input and has no image support. deepseek-v4-pro takes
# the judgment tier at roughly a quarter of kimi-k2.7-code's price.
#
# Thinking suffixes are constrained per model: deepseek-v4-pro only offers
# high/max, so `:low` would be invalid there.

modelRoles:
  # --- Claude: the director ---
  default: anthropic/claude-opus-5:xhigh
  # Opus 5 flattens out past medium, so the escalation roles buy thinking
  # budget only where it still pays: medium to plan, one step up to grind on
  # a hard bug. `max` was paying 2x the budget of `medium` for noise.
  plan: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  designer: anthropic/claude-opus-5:high
  vision: anthropic/claude-sonnet-5:medium

  # --- opencode-go: the workers ---
  # `task` backs the bundled `task` agent (@task) = /vibe "good".
  # `smol` backs the bundled `sonic` agent (@smol) = /vibe "fast",
  # and also scout + librarian.
  task: opencode-go/deepseek-v4-pro:high
  smol: opencode-go/gpt-5.6-luna:low
  tiny: opencode-go/gpt-5.6-luna:low
  commit: opencode-go/gpt-5.6-luna:low

# No task.agentModelOverrides: the bundled agents already resolve through the
# roles above (sonic -> @smol, task -> @task, designer -> @designer,
# reviewer -> @slow). Pinning them again would just be a second place to edit.
task:
  batch: true
  enableEffort: true
  eager: preferred
  enableLsp: true

retry:
  enabled: true
  modelFallback: true
  # The preflight that reads coding-plan usage reports. This is what notices
  # the Go plan approaching its $12/5h · $30/wk · $60/mo caps and moves to the
  # chain *before* a hard failure — without it, spillover only happens on an
  # actual error, which is too late to be useful.
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: confirm

  # Ordering is deliberate: drain the Go plan first, then spill to Zen.
  #
  # Go and Zen expose overlapping catalogs but bill differently — Go is the
  # capped plan, Zen is pay-as-you-go on the same OPENCODE_API_KEY. Go is
  # strictly cheaper where they overlap ($/1M in-out):
  #
  #   gpt-5.6-luna     Go 0.10/0.60   Zen 0.20/1.20   (2x)
  #   deepseek-v4-pro  Go 0.435/0.87  Zen 1.74/3.84   (4x)
  #   deepseek-v4-flash, kimi-k2.7-code, glm-5.2, minimax-m3 — identical
  #
  # so there is never a reason to reach Zen while Go quota remains.
  fallbackChains:
    # Per-model spillover: a worker lands on its own Zen twin, so the model
    # stays the same mid-workstream and only the billing route changes.
    "opencode-go/deepseek-v4-pro":
      - opencode-zen/deepseek-v4-pro:high
      - opencode-zen/kimi-k2.7-code:high
    "opencode-go/gpt-5.6-luna":
      - opencode-zen/gpt-5.6-luna:low
      - opencode-zen/deepseek-v4-flash:low

    # Catch-all. Also the safety net for the two keys above: if OMP resolves
    # chains by provider glob only and ignores model-specific keys, Go still
    # reaches Zen before anything else.
    "opencode-go/*":
      - opencode-zen/gpt-5.6-luna
      - anthropic/claude-sonnet-5:high

    # Claude quota wall -> Go plan first, Zen only once Go is also spent.
    "anthropic/*":
      - opencode-go/gpt-5.6-luna:xhigh
      - opencode-zen/gpt-5.6-luna:xhigh
    default:
      - opencode-go/gpt-5.6-luna:xhigh
      - opencode-zen/gpt-5.6-luna:xhigh

symbolPreset: nerd
theme:
  dark: dark-lunar
setupVersion: 1
statusLine:
  preset: full
  separator: powerline
  sessionAccent: true
  compactThinkingLevel: false
startup:
  quiet: true
autoResume: true
memory:
  backend: local
autolearn:
  enabled: true
  autoContinue: true
dev:
  autoqaConsent: granted
