symbolPreset: nerd
theme:
  dark: dark-lunar-statusline
  light: lunar-light-statusline
setupVersion: 2
statusLine:
  preset: custom
  separator: none
  sessionAccent: false
  compactThinkingLevel: false
  transparent: true
  leftSegments:
    - model
    - mode
    - collab
    - path
    - git
    - pr
    - context_pct
    - cost
  rightSegments:
    - session_name
  contextLine: annotated
  showHookStatus: true
  segmentOptions:
    {}
