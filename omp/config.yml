modelRoles:
  default: anthropic/claude-sonnet-5:medium
  plan: anthropic/claude-opus-5:medium
  slow: anthropic/claude-opus-5:high
  designer: anthropic/claude-sonnet-5:medium
  vision: anthropic/claude-sonnet-5:medium
  task: anthropic/claude-sonnet-5:medium
  adversary: openai-codex/gpt-5.6-sol:low
  smol: openai-codex/gpt-5.6-luna:xhigh
  tiny: anthropic/claude-haiku-4-5:low
  commit: openai-codex/gpt-5.6-luna:low
task:
  batch: true
  enableEffort: false
  eager: preferred
  enableLsp: true
retry:
  enabled: true
  modelFallback: true
  usageAwareFallback: true
  usageReservePct: 15
  usageReservePolicy: auto
  fallbackChains:
    anthropic/*:
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
      - openai-codex/gpt-5.6-sol:low
    openai-codex/*:
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
    opencode-go/*:
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
      - opencode-zen/deepseek-v4-flash:low
    opencode-zen/*:
      - opencode-go/muse-spark-1.2-contributor:low
      - opencode-go/minimax-m3:low
    default:
      - opencode-go/muse-spark-1.2-contributor
      - opencode-go/minimax-m3
      - opencode-zen/deepseek-v4-flash
symbolPreset: nerd
theme:
  dark: dark-lunar-statusline
  light: light
setupVersion: 2
statusLine:
  preset: default
  separator: none
  sessionAccent: true
  compactThinkingLevel: false
  transparent: true
  leftSegments:
    []
  rightSegments:
    []
  contextLine: annotated
  showHookStatus: true
  segmentOptions:
    {}
startup:
  quiet: false
autoResume: false
modelRoleStorage: global
memory:
  backend: "off"
autolearn:
  enabled: false
  autoContinue: true
dev:
  autoqaConsent: denied
hideThinkingBlock: true
advisor:
