# Non-secret Codex settings managed by this repository.
# install.sh merges only the keys present here into ~/.codex/config.toml.

[tui]
status_line = ["model-with-reasoning", "model", "reasoning", "context-used", "weekly-limit", "git-branch", "pull-request-number", "branch-changes", "project-name", "current-dir"]
status_line_use_colors = true

[skills]
max_context_tokens = 4000

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2

[agents.docs_researcher]
description = "Read-only researcher for documentation, APIs, specifications and web lookups."
config_file = "./agents/docs-researcher.toml"
