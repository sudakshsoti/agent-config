onboarding = false

[keys]
prefix = "ctrl+a"

# Single letter after the prefix. Still unbound: a i m.
new_worktree = "prefix+t"
new_workspace = "prefix+s"
settings = "prefix+shift+s"   # moved off prefix+s, which new_workspace now takes
open_worktree = "prefix+y"
last_pane = "prefix+u"

# Direct chords. ctrl+alt is the modifier family terminals leave alone, but
# Rectangle and similar window managers bind ctrl+alt+arrows.
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"
previous_tab = ["prefix+p", "ctrl+alt+left"]
next_tab = ["prefix+n", "ctrl+alt+right"]

# herdr-navigator (herdr/plugins.txt): fuzzy jump across workspaces, agents,
# projects, sessions and directories, plus previous-workspace toggle.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "previous workspace"

[ui.toast]
delivery = "herdr"

[theme]
name = "catppuccin"
auto_switch = false
